name: deploy-llms.yml

# Publishes llms.txt and llms-full.txt to the GitHub Pages site. Every deploy below
# uses publish_dir ./llms, so each of these paths gets both files.
#
# ref     published at
# main    /                and /v<major>/
# branch  /<branch>/
#
# The per-major copy lets an app stuck on an old major still fetch the manifest for
# the version it runs. keep_files:true stops a deploy wiping paths it did not write:
# older majors, and Storybook, which owns the same paths.

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - docs/COMPONENTS.md
      - scripts/build-llms.mjs
      - scripts/extract-props.mjs
      - scripts/extract-stories.mjs
      - .github/workflows/deploy-llms.yml
      - src/**
      - package.json

permissions:
  contents: write

# Serialised against upload-storybook.yml's Pages deploys: both push to the same
# gh-pages branch, so a shared group stops concurrent non-fast-forward pushes.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy-llms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # build-llms compares this commit's package.json against its parent's
          # to tell a release build from an ordinary one. The default depth of 1
          # has no parent, which would stamp every build "unreleased".
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22

      - name: Install dependencies
        run: LOCAL_MACHINE=false yarn install --frozen-lockfile

      # yarn build ends with scripts/pack-llms.mjs, which writes llms/ for the deploy
      # steps below and dist/llms.txt for the npm tarball.
      - name: Build package
        run: yarn build

      # pack-llms skips when dist/export.d.ts is absent. The deploy steps use
      # keep_files, so a skip would republish the old manifest with nothing to show
      # for it. Fail here instead.
      - name: Verify the manifest was generated
        run: |
          test -s llms/llms.txt || { echo "llms/llms.txt is missing or empty after yarn build"; exit 1; }
          tail -1 llms/llms.txt

      - name: Deploy llms.txt to Pages root
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./llms
          destination_dir: ./
          keep_files: true

      # A failed read would leave major empty and publish to /v/, so fail here instead.
      - name: Read major version
        if: github.ref == 'refs/heads/main'
        id: major
        run: |
          major="$(node -p 'require("./package.json").version.split(".")[0]')"
          : "${major:?could not read the major from package.json}"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Deploy llms.txt to per-major path
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./llms
          destination_dir: ./v${{ steps.major.outputs.major }}
          keep_files: true

      - name: Deploy llms.txt to per-branch preview
        if: github.ref != 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./llms
          destination_dir: ${{ github.ref_name }}
          keep_files: true
