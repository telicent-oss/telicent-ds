name: deploy-llms.yml

# The llms.txt published here is built from a branch, so it describes unreleased
# code. The copy matching a consumer's install ships in the package, as dist/llms.txt.
#
# keep_files:true stops this wiping upload-storybook.yml's files at the same paths.

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - docs/COMPONENTS.md
      - scripts/build-llms.mjs
      - scripts/extract-props.mjs
      - scripts/extract-stories.mjs
      - .github/workflows/deploy-llms.yml
      - src/**
      - package.json

permissions:
  contents: write

# Serialised against upload-storybook.yml's Pages deploys: both push to the same
# gh-pages branch, so a shared group stops concurrent non-fast-forward pushes.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy-llms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # build-llms runs `git show HEAD~1:package.json`. At depth 1 that fails,
          # and every build gets labelled "unreleased".
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22

      - name: Install dependencies
        run: LOCAL_MACHINE=false yarn install --frozen-lockfile

      # yarn build ends with build-llms.mjs: writes llms/ for the deploys below, and
      # dist/llms.txt for the npm tarball. Exits non-zero rather than write a bad file.
      - name: Build package
        run: yarn build

      - name: Deploy llms.txt to Pages root
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./llms
          destination_dir: ./
          keep_files: true

      - name: Deploy llms.txt to per-branch preview
        if: github.ref != 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./llms
          destination_dir: ${{ github.ref_name }}
          keep_files: true
