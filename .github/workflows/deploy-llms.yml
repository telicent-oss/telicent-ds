name: deploy-llms.yml

# The package ships its own dist/llms.txt, which is the copy that matches a
# consumer's installed version and says so in its version banner. These site copies
# track whatever branch built them, so their banner sends a reader to the packaged
# copy instead.
#
# keep_files:true stops a deploy wiping paths it did not write. upload-storybook.yml
# publishes Storybook to these same two paths, and each workflow's keep_files
# protects the other's files.

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - docs/COMPONENTS.md
      - scripts/build-llms.mjs
      - scripts/extract-props.mjs
      - scripts/extract-stories.mjs
      - .github/workflows/deploy-llms.yml
      - src/**
      - package.json

permissions:
  contents: write

# Serialised against upload-storybook.yml's Pages deploys: both push to the same
# gh-pages branch, so a shared group stops concurrent non-fast-forward pushes.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy-llms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # build-llms compares this commit's package.json against its parent's
          # to tell a release build from an ordinary one. The default depth of 1
          # has no parent, which would stamp every build "unreleased".
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22

      - name: Install dependencies
        run: LOCAL_MACHINE=false yarn install --frozen-lockfile

      # yarn build ends with scripts/build-llms.mjs, which writes llms/ for the
      # deploy steps below and dist/llms.txt for the npm tarball. It exits non-zero
      # rather than write a manifest it cannot label or fill, so a green build here
      # already means llms/llms.txt is present.
      - name: Build package
        run: yarn build

      - name: Deploy llms.txt to Pages root
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./llms
          destination_dir: ./
          keep_files: true

      - name: Deploy llms.txt to per-branch preview
        if: github.ref != 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./llms
          destination_dir: ${{ github.ref_name }}
          keep_files: true
